# OpenSCAP Scheduled Scan Configuration
# Builds on common.conf foundation

# Email configuration for OpenSCAP reports
OPENSCAP_EMAIL_FROM="openscap+${SERVER_NAME}@${EMAIL_DOMAIN}"

# Scan content. The version is pinned so week-over-week results stay comparable;
# changing it is a deliberate change - expect new rules to appear as new failures
# on the first scan after an upgrade.
OPENSCAP_CONTENT_DIR="/usr/local/share/scap"
OPENSCAP_CONTENT_VERSION="0.1.81"
OPENSCAP_DATASTREAM="$OPENSCAP_CONTENT_DIR/ssg-$OPENSCAP_CONTENT_VERSION/ssg-ubuntu2404-ds.xml"
OPENSCAP_TAILORING="$OPENSCAP_CONTENT_DIR/cis-l1-dats-tailoring.xml"
OPENSCAP_PROFILE="xccdf_org.ssgproject.content_profile_cis_level1_server_dats"
